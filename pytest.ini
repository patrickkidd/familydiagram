[pytest]
testpaths = pkdiagram/tests
addopts = -vv --ignore=lib --ignore=sysroot --ignore=test_qml.py --disable-warnings -p no:ddtrace -p no:ddtrace.pytest_bdd -p no:ddtrace.pytest_benchmark  --ignore=familydiagram/sysroot
junit_family=legacy
markers =
    beta: runs as a beta build; the feature under test is beta-only
    access_rights
    no_gui
    sandbox: launches real apps or a sandbox backend (mcpserver/tests; run by naming the path)
