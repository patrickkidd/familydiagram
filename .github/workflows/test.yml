name: Test

# familydiagram unit tests as a PR check, on the deployment targets
# (macOS + Windows).
#
# Pre-existing test-isolation defect: a single shared pytest process leaks Qt
# resources that accumulate and deadlock ~5-8% in (native hang). Every file
# passes alone, so CI runs one process per file via
# scripts/ci_run_tests_isolated.py (cross-platform). Root-fixing the leak,
# plus the CI-only server/license/session tests it quarantines, is tracked in
# doc/plans/2026-05-17--ci-test-suite-isolation.md.
on:
  workflow_dispatch:
  pull_request:

jobs:
  test-macos:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      TWINE_REPOSITORY_URL: "${{ secrets.TWINE_REPOSITORY_URL }}"
      TWINE_USERNAME: "${{ secrets.TWINE_USERNAME }}"
      TWINE_PASSWORD: "${{ secrets.TWINE_PASSWORD }}"
      QT_QPA_PLATFORM: offscreen
      # Analytics raises if its Datadog key is None at construction. A dummy
      # non-None key satisfies the ctor; analytics tests mock their own net.
      FD_BUILD_DATADOG_API_KEY: "ci-dummy-key"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.6
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up virtual env + deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[test]" --extra-index-url=$TWINE_REPOSITORY_URL
          .venv/bin/pip install pytest-timeout

      - name: brew install qt@5
        run: brew install qt@5

      - name: Build _pkdiagram (SIP C++ extension) + Qt UI forms
        run: |
          source .venv/bin/activate
          export PATH="/usr/local/opt/qt@5/bin:$PATH"
          which qmake
          rm -f CMakeCache.txt
          rm -rf CMakeFiles
          cmake . -DCMAKE_PREFIX_PATH=/usr/local/opt/qt@5
          make
          SO=$(ls .venv/lib/python3.11/site-packages/_pkdiagram.cpython-*-darwin.so)
          echo "Built extension: $SO"
          PYQT5_DIR="$(pwd)/.venv/lib/python3.11/site-packages/PyQt5/Qt5"
          install_name_tool -add_rpath "$PYQT5_DIR/lib" "$SO"
          for fw in QtCore QtGui QtWidgets; do
            install_name_tool -change \
              "/usr/local/opt/qt@5/lib/$fw.framework/Versions/5/$fw" \
              "@rpath/$fw.framework/Versions/5/$fw" "$SO"
          done
          otool -L "$SO"

      - name: Write build config
        run: .venv/bin/python bin/update_build_info.py

      - name: Smoke test (fast env gate)
        run: .venv/bin/python -m pytest -vv pkdiagram/tests/test_version.py

      - name: Full test suite (one process per file)
        run: .venv/bin/python scripts/ci_run_tests_isolated.py

  test-windows:
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      TWINE_REPOSITORY_URL: "${{ secrets.TWINE_REPOSITORY_URL }}"
      TWINE_USERNAME: "${{ secrets.TWINE_USERNAME }}"
      TWINE_PASSWORD: "${{ secrets.TWINE_PASSWORD }}"
      QT_QPA_PLATFORM: offscreen
      FD_BUILD_DATADOG_API_KEY: "ci-dummy-key"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.6
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up virtual env + deps
        shell: cmd
        run: |
          python -m venv .venv
          .venv\Scripts\pip install --upgrade pip
          .venv\Scripts\pip install -e ".[test]" --extra-index-url=%TWINE_REPOSITORY_URL%
          .venv\Scripts\pip install pytest-timeout

      - name: Install Qt 5.15.2 (msvc2019_64)
        shell: cmd
        run: |
          call .venv\Scripts\activate.bat
          pip install aqtinstall
          aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 --outputdir C:\Qt --archives qtbase qtdeclarative qtgraphicaleffects qtimageformats qtquickcontrols qtquickcontrols2 qttools qtwinextras qtmultimedia

      - name: Setup MSVC dev environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build _pkdiagram (SIP C++ extension) + Qt UI forms
        shell: cmd
        run: |
          call .venv\Scripts\activate.bat
          set PATH=C:\Qt\5.15.2\msvc2019_64\bin;%PATH%
          qmake --version
          cd _pkdiagram
          sip-install --qmake C:\Qt\5.15.2\msvc2019_64\bin\qmake.exe --verbose
          cd ..
          pyuic5 pkdiagram\mainwindow\mainwindow.ui -o pkdiagram\mainwindow\mainwindow_form.py
          pyuic5 pkdiagram\mainwindow\preferences.ui -o pkdiagram\mainwindow\preferences_form.py
          pyuic5 pkdiagram\mainwindow\welcome.ui -o pkdiagram\mainwindow\welcome_form.py
          python -c "from _pkdiagram import CUtil; print('CUtil OK', CUtil.operatingSystem())"

      - name: Write build config
        shell: cmd
        run: .venv\Scripts\python bin\update_build_info.py

      - name: Smoke test (fast env gate)
        shell: cmd
        run: .venv\Scripts\python -m pytest -vv pkdiagram\tests\test_version.py

      - name: Full test suite (one process per file)
        shell: cmd
        run: |
          set PATH=C:\Qt\5.15.2\msvc2019_64\bin;%PATH%
          .venv\Scripts\python scripts\ci_run_tests_isolated.py
