name: Test

# Phased rollout (branch ci/familydiagram-tests):
#   1. workflow_dispatch only, macOS smoke subset   (done — env proven)
#   2. macOS full suite, per-file isolation         <-- current
#   3. add Windows
#   4. add pull_request trigger (becomes a PR check)
#
# The suite has a pre-existing test-isolation defect: a single shared pytest
# process leaks Qt resources that accumulate and deadlock ~5-8% in (native
# hang). Every file passes alone, so CI runs one process per file via
# scripts/ci-run-tests-isolated.sh. Root-fixing the leak is a separate
# test-suite workstream tracked outside this CI branch.
on:
  workflow_dispatch:

jobs:
  test-macos:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      TWINE_REPOSITORY_URL: "${{ secrets.TWINE_REPOSITORY_URL }}"
      TWINE_USERNAME: "${{ secrets.TWINE_USERNAME }}"
      TWINE_PASSWORD: "${{ secrets.TWINE_PASSWORD }}"
      QT_QPA_PLATFORM: offscreen
      # Analytics raises if its Datadog key is None at construction. A dummy
      # non-None key satisfies the ctor; the analytics tests mock their own
      # network. Do NOT set FD_DISABLE_ANALYTICS — it breaks test_analytics.py.
      FD_BUILD_DATADOG_API_KEY: "ci-dummy-key"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11.6
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up virtual env + deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e ".[test]" --extra-index-url=$TWINE_REPOSITORY_URL
          .venv/bin/pip install pytest-timeout

      - name: brew install qt@5
        run: brew install qt@5

      - name: Build _pkdiagram (SIP C++ extension) + Qt UI forms
        run: |
          source .venv/bin/activate
          export PATH="/usr/local/opt/qt@5/bin:$PATH"
          which qmake
          rm -f CMakeCache.txt
          rm -rf CMakeFiles
          cmake . -DCMAKE_PREFIX_PATH=/usr/local/opt/qt@5
          make
          SO=$(ls .venv/lib/python3.11/site-packages/_pkdiagram.cpython-*-darwin.so)
          echo "Built extension: $SO"
          PYQT5_DIR="$(pwd)/.venv/lib/python3.11/site-packages/PyQt5/Qt5"
          install_name_tool -add_rpath "$PYQT5_DIR/lib" "$SO"
          for fw in QtCore QtGui QtWidgets; do
            install_name_tool -change \
              "/usr/local/opt/qt@5/lib/$fw.framework/Versions/5/$fw" \
              "@rpath/$fw.framework/Versions/5/$fw" "$SO"
          done
          otool -L "$SO"

      - name: Write build config
        run: .venv/bin/python bin/update_build_info.py

      - name: Smoke test (fast env gate)
        run: |
          .venv/bin/python -m pytest -vv pkdiagram/tests/test_version.py

      - name: Full test suite (one process per file)
        run: bash scripts/ci-run-tests-isolated.sh
